[build-system]
requires = ["setuptools>=77", "wheel"]  # 77: SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "rebirth-ai"
version = "0.1.0"
description = "Modernize legacy code, or translate it between 8 languages, with local models; every change is checked by your own tests in a Docker sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hugo-Nathan Bele-Binda" }]
keywords = ["code-migration", "code-modernization", "code-translation", "legacy-code", "ollama", "llm", "docker", "technical-debt"]
# Upper bounds: the next release that may break us (tree-sitter grammars track the core's ABI, so they stay
# on the tested minor). scripts/bootstrap.sh installs within these ranges; CI tests the newest allowed.
dependencies = [
  "docker>=7.0.0,<8",
  "tree-sitter>=0.22.0,<0.27",
  "tree-sitter-javascript>=0.21.0,<0.26",
  "tree-sitter-typescript>=0.21.0,<0.24",
  "tree-sitter-python>=0.21.0,<0.26",
  "tree-sitter-go>=0.21.0,<0.26",
  "tree-sitter-java>=0.21.0,<0.24",
  "tree-sitter-c-sharp>=0.21.0,<0.24",
  "tree-sitter-rust>=0.21.0,<0.25",
  "tree-sitter-cpp>=0.21.0,<0.24",
  "tree-sitter-swift>=0.0.1,<0.8",
  "sentence-transformers>=3.0.0,<7",
  "scikit-learn>=1.4.0,<2",
  "pandas>=2.2.0,<4",
  "numpy>=1.26.0,<3",
  "httpx>=0.27.0,<1",
  "pydantic>=2.6.0,<3",
  "pydantic-settings>=2.2.0,<3",
  "typer>=0.12.0,<0.30",
  "rich>=13.7.0,<16",
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "PyYAML>=6.0,<7",  # configs/routing.yaml (rebirth migrate --backend auto)
]

[project.optional-dependencies]
graph = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
]
ml = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "peft>=0.11.0",
  "datasets>=2.19.0",
  "accelerate>=0.30.0",
  "bitsandbytes>=0.43.0",
]
github = [
  "PyGithub>=2.3.0",
]
# Phase 15 DPO (training/train_dpo.py). Installed with --no-deps locally so the ROCm torch stays put.
dpo = [
  "trl>=1.17,<2",
]
# Tool-generated pairs (training/make_tool_pairs.py): clang-tidy wheel; Rust comes from rustup.
datagen = [
  "clang-tidy>=20",
]
mlops = [
  "mlflow-skinny>=3.18,<4",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "PyYAML>=6.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
rebirth = "rebirth_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned rule set (CI runs exactly this). B008 = typer.Option(...) defaults — the typer idiom.
select = ["E", "F", "W", "I", "UP", "B", "RUF100"]
ignore = ["B008", "E501"]
