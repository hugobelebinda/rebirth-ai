[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebirth-ai"
version = "0.1.0"
description = "Autonomous closed-loop AI agent for legacy codebase migration (LangGraph + RAG + LoRA + Docker sandbox)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hugo-Nathan Bele-Binda" }]
keywords = ["migration", "langgraph", "lora", "rag", "technical-debt"]
dependencies = [
  "docker>=7.0.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-javascript>=0.21.0",
  "tree-sitter-typescript>=0.21.0",
  "sentence-transformers>=3.0.0",
  "scikit-learn>=1.4.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
graph = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
]
ml = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "peft>=0.11.0",
  "datasets>=2.19.0",
  "accelerate>=0.30.0",
  "bitsandbytes>=0.43.0",
]
github = [
  "PyGithub>=2.3.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
rebirth = "rebirth_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
